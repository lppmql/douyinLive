# 抖音留资直播分析系统 - Docker 服务编排
# Phase 0: MySQL + Redis
# Phase 5: 加入 FunASR

services:
  mysql:
    image: mysql:8.0
    container_name: douyin_live_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME:-douyin_live}
      # 全新数据卷由镜像创建；已有数据卷由启动脚本的幂等账号初始化补齐权限。
      MYSQL_USER: ${DB_USER:-douyin_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --group_concat_max_len=1024000

  redis:
    image: redis:7
    container_name: douyin_live_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}

  # Phase 36: Qdrant 向量数据库 — 知识库 RAG 语义检索
  qdrant:
    image: qdrant/qdrant:v1.13.5
    container_name: douyin_live_qdrant
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:6333:6333"   # HTTP API（Python 客户端用）
      - "127.0.0.1:6334:6334"   # gRPC（可选）
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.13
    container_name: douyin_live_funasr
    restart: unless-stopped
    # 同一个服务进程同时支持直播 online 初稿和下播 offline 最终稿。
    # 业务层仍严格串行使用模型；容器资源和内部线程可按宿主机配置调优。
    cpus: ${FUNASR_CPU_LIMIT:-2.0}
    mem_limit: ${FUNASR_MEMORY_LIMIT:-1800m}
    ports:
      - "127.0.0.1:10096:10095"
    volumes:
      - ./data/funasr/models:/workspace/models
    working_dir: /workspace/FunASR/runtime
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "bash run_server_2pass.sh --certfile 0 --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-onnx --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --itn-dir thuduj12/fst_itn_zh --lm-dir '' --hotword /workspace/models/hotwords.txt --decoder-thread-num ${FUNASR_DECODER_THREAD_NUM:-10} --model-thread-num ${FUNASR_MODEL_THREAD_NUM:-1} --io-thread-num ${FUNASR_IO_THREAD_NUM:-1}; while pgrep funasr-wss-serv >/dev/null; do sleep 5; done; exit 1"
    profiles:
      - funasr
