name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changes and check whitespace
        id: scope
        # 只输出布尔值；不把提交信息、分支名称或文件名拼入可执行命令。
        run: python3 scripts/ci_change_scope.py >> "$GITHUB_OUTPUT"
      - name: Explain documentation-only result
        if: steps.scope.outputs.run_full == 'false'
        run: echo "普通说明文档检查通过，已跳过依赖安装、数据库、测试和构建。"

  backend-test:
    needs: change-scope
    if: needs.change-scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: douyin_live
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DEBUG: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-test-password
      DB_NAME: douyin_live
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET_KEY: ci-only-secret
      ASR_AUTO_START: "false"
      MONITOR_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check app/ tests/test_check_workflow.py ../scripts/ci_change_scope.py
      - run: alembic check
      - run: pytest -q --cov=app --cov-report=term --cov-fail-under=45

      # 与后端测试复用本次已安装的 Python 依赖，不再另建任务重复 pip install。
      - name: Export OpenAPI schema from FastAPI
        run: python -c "from app.main import app; import json; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate and check API types
        working-directory: frontend
        run: |
          # 与 pnpm-lock.yaml 当前解析版本一致，避免 npx 随时间升级造成差异。
          # 回归测试会校验此版本与锁文件一致。
          npx --yes openapi-typescript@7.13.0 "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/generated.d.ts"
          diff <(tail -n +5 "$RUNNER_TEMP/generated.d.ts") <(tail -n +5 src/typings/api/generated.d.ts) || {
            echo "前后端 API 类型不同步，请本地执行 cd frontend && pnpm gen-api 后提交。"
            exit 1
          }
          echo "✅ API 类型与后端 schema 一致"

  frontend-check:
    needs: change-scope
    if: needs.change-scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cp .env.ci .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec oxlint .
      - run: pnpm exec eslint .
      - run: pnpm build

  # 检查 docker-compose.yml 配置是否有效
  docker-check:
    needs: change-scope
    if: needs.change-scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare example environment
        run: cp .env.example .env
      - name: Validate docker-compose configuration
        run: docker compose config -q
