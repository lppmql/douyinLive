# DataEase 2.10.25 外部配置；具体值由 docker-compose.yml 中的 DE_* 环境变量注入。
server:
  tomcat:
    connection-timeout: 70000
  servlet:
    context-path: ${DE_CONTEXT_PATH:}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  profiles:
    include: ${DE_SPRING_PROFILE:mysql}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://${DE_MYSQL_HOST:mysql}:${DE_MYSQL_PORT:3306}/${DE_MYSQL_DB:dataease}?${DE_MYSQL_PARAMS}
    username: ${DE_MYSQL_USER:root}
    password: ${DE_MYSQL_PASSWORD}

dataease:
  apisix-api:
    domain: ${DE_APISIX_API:http://apisix:9180}
    key: ${DE_APISIX_KEY:}
  export:
    views:
      limit: ${DE_EXPORT_VIEWS_LIMIT:100000}
    dataset:
      limit: ${DE_EXPORT_DATASET_LIMIT:100000}
  origin-list: ${DE_ORIGIN_LIST:http://localhost:9527,http://127.0.0.1:9527}
  login_timeout: ${DE_LOGIN_TIMEOUT:480}
  dataease-servers: ${DE_SERVERS:dataease}
  playwright-server: ${DE_PLAYWRIGHT_SERVER:http://playwright:3000}

task:
  executor:
    address: ${DE_TASK_EXECUTOR_ADDRESS:http://sync-task-actuator:9001}
    log:
      path: /opt/dataease2.0/logs/sync-task/task-handler-log
